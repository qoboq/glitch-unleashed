<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>Glitch Unleashed</title>
    <style>
      @font-face { font-family: "Jersey 15"; src: url("assets/fonts/Jersey15-Regular.woff2") format("woff2"); }
      html, body { margin: 0; height: 100%; background: #111; overflow: hidden; overscroll-behavior: none; }
      /* no scrolling, zooming or text selection while playing with your thumbs */
      body, canvas { touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
      #game { width: 100%; height: 100%; }
      canvas { image-rendering: pixelated; }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
